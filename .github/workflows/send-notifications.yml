name: Send Scheduled Notifications

on:
  schedule:
    # Every 30 minutes — catches the 8 AM verse, 6 PM streak, and 8 PM fasting
    # windows across all user timezones.
    - cron: '0,30 * * * *'
  workflow_dispatch: # Allow manual trigger from GitHub Actions tab

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Call send-scheduled-reminders
        run: |
          # --fail makes a 4xx/5xx turn this step red instead of silently green.
          curl --fail -sS \
            -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            https://uceqydqvjapkobqwrbxw.supabase.co/functions/v1/send-scheduled-reminders
